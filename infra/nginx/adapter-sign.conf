# Nginx — reverse proxy com TLS para Adapter Sign.
# USE SOMENTE em servidores SEM outro proxy em 80/443 (não em servidores com Easypanel/Traefik —
# ver docs/deployment.md). Requer web e api publicados em 127.0.0.1:3000 e 127.0.0.1:4000
# (o docker-compose.yml base não publica portas).
# Substitua app.exemplo.com.br / api.exemplo.com.br pelos seus domínios e emita
# certificados (ex.: certbot --nginx). Mantenha TRUST_PROXY_HOPS=1 no .env.

map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 80;
  server_name app.exemplo.com.br api.exemplo.com.br;
  return 301 https://$host$request_uri;
}

# Aplicação web (+ API na mesma origem em /api — cookies first-party)
server {
  listen 443 ssl;
  http2 on;
  server_name app.exemplo.com.br;

  ssl_certificate     /etc/letsencrypt/live/app.exemplo.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.exemplo.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
  }
}

# API pública para integrações (API keys)
server {
  listen 443 ssl;
  http2 on;
  server_name api.exemplo.com.br;

  ssl_certificate     /etc/letsencrypt/live/api.exemplo.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.exemplo.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 120s;
  }
}
