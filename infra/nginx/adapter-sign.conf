# Nginx — reverse proxy com TLS para Adapter Sign (domínio único sign.adapterco.com.br).
# USE SOMENTE em servidores SEM outro proxy em 80/443 (não em servidores com Easypanel/Traefik —
# ver docs/deployment.md). Requer web e api publicados em 127.0.0.1:3000 e 127.0.0.1:4000
# (o docker-compose.yml base não publica portas). Emita o certificado com certbot.
# Mantenha TRUST_PROXY_HOPS=1 no .env.

map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 80;
  server_name sign.adapterco.com.br;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name sign.adapterco.com.br;

  ssl_certificate     /etc/letsencrypt/live/sign.adapterco.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sign.adapterco.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  client_max_body_size 25m;

  # API (mesma origem: cookies first-party). Vai direto à API para preservar o IP do cliente.
  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
    proxy_read_timeout 120s;
  }

  location = /ready {
    proxy_pass http://127.0.0.1:4000;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;
  }
}
