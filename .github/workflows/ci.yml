name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Valor fictício: `prisma generate` exige a variável, mas não conecta ao banco.
  DATABASE_URL: postgresql://build:build@localhost:5432/build

jobs:
  quality:
    name: Lint · Typecheck · Testes unitários · Build · Auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Instalar dependências
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_INTERNAL_URL: http://localhost:4000
      # Falhas críticas bloqueiam. As altas são listadas para revisão: hoje há duas conhecidas
      # (mysql2 e deepmerge-ts), fixadas dentro do CLI do Prisma 7.10 — ver docs/decisions.md.
      - name: Auditoria de dependências (produção)
        run: |
          npm audit --omit=dev --audit-level=high || true
          npm audit --omit=dev --audit-level=critical

  migrations:
    name: Migrations × schema (drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adaptersign
          POSTGRES_USER: adaptersign
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adaptersign" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://adaptersign:ci-password@localhost:5432/adaptersign?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: if [ -f package-lock.json ]; then npm ci -w @adapter-sign/api; else npm install -w @adapter-sign/api; fi
      - name: Aplicar migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Banco migrado deve corresponder ao schema.prisma
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  integration:
    name: E2E (PostgreSQL + Redis + MinIO + Mailpit)
    runs-on: ubuntu-latest
    needs: [quality, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Gerar .env de teste (valores efêmeros)
        run: |
          cp .env.example .env
          sed -i "s|^NODE_ENV=.*|NODE_ENV=test|" .env
          sed -i "s|^APP_PUBLIC_URL=.*|APP_PUBLIC_URL=http://localhost:3000|" .env
          sed -i "s|^API_PUBLIC_URL=.*|API_PUBLIC_URL=http://localhost:4000|" .env
          sed -i "s|^COOKIE_SECURE=.*|COOKIE_SECURE=false|" .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^JWT_ACCESS_SECRET=.*|JWT_ACCESS_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^TOKEN_HASH_SECRET=.*|TOKEN_HASH_SECRET=$(openssl rand -hex 32)|" .env
      - name: Subir infraestrutura
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d adaptersign-postgres adaptersign-redis adaptersign-minio adaptersign-minio-init adaptersign-mailpit
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Migrations + testes de integração (serviços acessados via localhost)
        working-directory: apps/api
        run: |
          set -a; . ../../.env; set +a
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          export REDIS_URL="redis://:${REDIS_PASSWORD}@localhost:6379/0"
          export STORAGE_ENDPOINT=http://localhost:9000 SMTP_HOST=localhost SMTP_PORT=1025 MAILPIT_URL=http://localhost:8025
          npx prisma migrate deploy
          npm run test:integration
