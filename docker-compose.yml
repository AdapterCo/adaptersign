# Adapter Sign — Docker Compose
#
# Este arquivo NÃO publica portas no host. Isso evita conflito com outras aplicações do
# mesmo servidor (ex.: Traefik/Easypanel em 80/443, painel do Easypanel em 3000, outros
# Postgres/Redis). A exposição pública é feita pelo reverse proxy existente, que roteia
# para os serviços internos `web:3000` e `api:4000` — ver docs/deployment.md.
#
# Produção (VPS), com storage e SMTP externos:
#   docker compose up -d --build
# Desenvolvimento / CI (publica portas em 127.0.0.1 e sobe MinIO + Mailpit):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile local up -d --build

# Nome fixo: containers, volumes e rede ficam com prefixo "adaptersign-" e não
# dependem do nome da pasta clonada.
name: adaptersign

x-api-env: &api-env
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Aplica migrations pendentes e encerra (nunca comandos destrutivos).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: adaptersign-api:latest
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-env
    image: adaptersign-api:latest
    pull_policy: never
    command: ["node", "dist/main.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "4000"

  worker:
    <<: *api-env
    image: adaptersign-api:latest
    pull_policy: never
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Adapter Sign}
    image: adaptersign-web:latest
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"

  # ───────── Somente desenvolvimento/homologação (profile "local") ─────────
  minio:
    profiles: ["local"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data

  # Cria o bucket PRIVADO (sem acesso anônimo).
  minio-init:
    profiles: ["local"]
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing local/"$${STORAGE_BUCKET}" &&
        mc anonymous set none local/"$${STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    restart: "no"

  mailpit:
    profiles: ["local"]
    image: axllent/mailpit:latest

volumes:
  pgdata:
  redisdata:
  miniodata:
