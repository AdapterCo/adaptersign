# Adapter Sign — Docker Compose
#
# Projetado para conviver com outras aplicações em produção no mesmo servidor, sem afetá-las:
# - nenhuma porta publicada no host (a exposição pública é feita pelo Traefik existente,
#   via labels em docker-compose.traefik.yml, sem alterar a configuração do Traefik);
# - nome de projeto fixo e serviços com prefixo "adaptersign-": containers, volumes, imagens
#   e nomes DNS são exclusivos e não colidem com serviços de outras aplicações;
# - Postgres e Redis dedicados, acessíveis apenas pela rede interna deste projeto.
#
# Produção:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
# Desenvolvimento / CI (portas em 127.0.0.1 + MinIO + Mailpit):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

name: adaptersign

x-api-env: &api-env
  env_file: .env
  restart: unless-stopped

services:
  adaptersign-postgres:
    labels:
      - traefik.enable=false
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adaptersign-redis:
    labels:
      - traefik.enable=false
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Aplica migrations pendentes e encerra (nunca comandos destrutivos).
  adaptersign-migrate:
    labels:
      - traefik.enable=false
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: adaptersign-api:latest
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      adaptersign-postgres:
        condition: service_healthy
    restart: "no"

  adaptersign-api:
    <<: *api-env
    image: adaptersign-api:latest
    pull_policy: never
    command: ["node", "dist/main.js"]
    depends_on:
      adaptersign-migrate:
        condition: service_completed_successfully
      adaptersign-redis:
        condition: service_healthy
    expose:
      - "4000"

  adaptersign-worker:
    labels:
      - traefik.enable=false
    <<: *api-env
    image: adaptersign-api:latest
    pull_policy: never
    command: ["node", "dist/worker.js"]
    depends_on:
      adaptersign-migrate:
        condition: service_completed_successfully
      adaptersign-redis:
        condition: service_healthy
    healthcheck:
      disable: true

  adaptersign-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://adaptersign-api:4000
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Adapter Sign}
    image: adaptersign-web:latest
    restart: unless-stopped
    depends_on:
      - adaptersign-api
    expose:
      - "3000"

# Storage (R2/S3) e SMTP são serviços externos em produção. MinIO e Mailpit, usados só em
# desenvolvimento e CI, ficam em docker-compose.dev.yml.

volumes:
  pgdata:
  redisdata:
