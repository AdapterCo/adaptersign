# Override SOMENTE para desenvolvimento local e CI — não usar no servidor de produção.
# Publica portas apenas em 127.0.0.1 (configuráveis) e adiciona MinIO (S3 local) e
# Mailpit (SMTP de teste), que em produção são substituídos por R2/S3 e SMTP reais.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  adaptersign-postgres:
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5432}:5432"
  adaptersign-redis:
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6379}:6379"
  adaptersign-api:
    ports:
      - "127.0.0.1:${DEV_API_PORT:-4000}:4000"
  adaptersign-web:
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-3100}:3000"

  adaptersign-minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-9101}:9001"

  # Cria o bucket PRIVADO (sem acesso anônimo).
  adaptersign-minio-init:
    image: minio/mc:latest
    depends_on:
      - adaptersign-minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://adaptersign-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done &&
        mc mb --ignore-existing local/"$${STORAGE_BUCKET}" &&
        mc anonymous set none local/"$${STORAGE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-minio-secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-adaptersign-documents}
    restart: "no"

  adaptersign-mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${DEV_MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${DEV_MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  miniodata:
